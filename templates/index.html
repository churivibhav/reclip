<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DownLoader</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* shadcn/ui-style tokens (zinc base, red primary) */
    :root {
      --background: #ffffff;
      --foreground: #09090b;
      --card: #ffffff;
      --card-foreground: #09090b;
      --primary: #dc2626;
      --primary-hover: #b91c1c;
      --primary-foreground: #fef2f2;
      --secondary: #f4f4f5;
      --secondary-hover: #e4e4e7;
      --secondary-foreground: #18181b;
      --muted: #f4f4f5;
      --muted-foreground: #71717a;
      --border: #e4e4e7;
      --ring: #dc2626;
      --success: #16a34a;
      --destructive: #b91c1c;
      --radius: 0.5rem;

      /* aliases used by inline styles in the script below */
      --accent: var(--primary);
      --error: var(--destructive);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background: #09090b;
        --foreground: #fafafa;
        --card: #09090b;
        --card-foreground: #fafafa;
        --primary: #ef4444;
        --primary-hover: #dc2626;
        --primary-foreground: #fafafa;
        --secondary: #27272a;
        --secondary-hover: #3f3f46;
        --secondary-foreground: #fafafa;
        --muted: #27272a;
        --muted-foreground: #a1a1aa;
        --border: #27272a;
        --ring: #ef4444;
        --success: #22c55e;
        --destructive: #f87171;
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; border-color: var(--border); }

    body {
      font-family: 'Geist', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      font-feature-settings: 'rlig' 1, 'calt' 1;
      -webkit-font-smoothing: antialiased;
      background: var(--background);
      color: var(--foreground);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .page {
      max-width: 640px;
      margin: 0 auto;
      padding: 64px 24px 80px;
    }

    .brand { margin-bottom: 32px; }
    .brand h1 {
      font-size: 2.25rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      line-height: 1.1;
      color: var(--foreground);
    }
    .brand p {
      margin-top: 8px;
      font-size: 0.95rem;
      color: var(--muted-foreground);
    }

    textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: transparent;
      color: var(--foreground);
      font-family: inherit;
      font-size: 0.875rem;
      line-height: 1.5;
      outline: none;
      resize: none;
      min-height: 56px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
      transition: border-color 0.15s, box-shadow 0.15s;
      margin-bottom: 8px;
    }
    textarea:focus-visible {
      border-color: var(--ring);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--ring) 25%, transparent);
    }
    textarea::placeholder { color: var(--muted-foreground); }

    .hint {
      font-size: 0.8rem;
      color: var(--muted-foreground);
      margin-bottom: 20px;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 6px;
      align-items: center;
    }

    /* Tabs-style toggle */
    .pill-group {
      display: inline-flex;
      gap: 2px;
      padding: 3px;
      border-radius: var(--radius);
      background: var(--muted);
    }
    .pill {
      padding: 6px 14px;
      font-family: inherit;
      font-size: 0.875rem;
      font-weight: 500;
      border: none;
      border-radius: calc(var(--radius) - 2px);
      background: transparent;
      color: var(--muted-foreground);
      cursor: pointer;
      transition: color 0.15s, background 0.15s, box-shadow 0.15s;
    }
    .pill.active {
      background: var(--background);
      color: var(--foreground);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
    }
    .pill:not(.active):hover { color: var(--foreground); }

    /* Buttons */
    .fetch-btn,
    .card-dl-btn,
    .dl-all-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: 1px solid transparent;
      border-radius: var(--radius);
      font-family: inherit;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s, box-shadow 0.15s;
    }
    .fetch-btn:focus-visible,
    .card-dl-btn:focus-visible,
    .dl-all-btn:focus-visible,
    .pill:focus-visible,
    .q-chip:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--ring) 35%, transparent);
    }
    .fetch-btn:disabled,
    .card-dl-btn:disabled,
    .dl-all-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* default = primary (red) */
    .fetch-btn {
      flex: 1;
      height: 38px;
      padding: 0 16px;
      font-size: 0.875rem;
      background: var(--primary);
      color: var(--primary-foreground);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    }
    .fetch-btn:hover:not(:disabled) { background: var(--primary-hover); }

    /* Cards */
    .cards { margin-top: 24px; }

    .card {
      display: flex;
      gap: 14px;
      border: 1px solid var(--border);
      border-radius: calc(var(--radius) + 4px);
      background: var(--card);
      color: var(--card-foreground);
      padding: 14px;
      margin-bottom: 10px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
      animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card-thumb {
      width: 120px;
      min-width: 120px;
      height: 80px;
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--muted);
      flex-shrink: 0;
      position: relative;
    }
    .card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    /* No-thumbnail icon */
    .card-thumb .no-thumb {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted-foreground);
    }
    .card-thumb .no-thumb svg {
      width: 28px;
      height: 28px;
      opacity: 0.6;
    }

    /* Skeleton for loading state (shadcn animate-pulse) */
    .card-thumb.loading,
    .skeleton-line {
      background: var(--muted);
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    .skeleton-line {
      height: 12px;
      border-radius: 4px;
      margin-bottom: 6px;
    }
    .skeleton-line.short { width: 40%; height: 10px; }
    .skeleton-line.medium { width: 75%; }
    @keyframes pulse { 50% { opacity: 0.5; } }

    .card-body {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      line-height: 1.35;
      color: var(--card-foreground);
      margin-bottom: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .card-meta {
      font-size: 0.8rem;
      color: var(--muted-foreground);
      margin-bottom: 10px;
    }

    .card-actions {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }

    /* card buttons: outline = "Download", primary = "Save to server" */
    .card-dl-btn {
      height: 32px;
      padding: 0 12px;
      font-size: 0.8rem;
      background: var(--background);
      color: var(--foreground);
      border-color: var(--border);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    }
    .card-dl-btn:hover:not(:disabled) { background: var(--secondary); }
    .card-dl-btn.done { background: var(--success); border-color: var(--success); color: #fff; }
    .card-dl-btn.done:hover:not(:disabled) { background: var(--success); filter: brightness(0.92); }
    .card-dl-btn.error { background: var(--destructive); border-color: var(--destructive); color: #fff; }

    .card-status {
      font-size: 0.8rem;
      color: var(--muted-foreground);
    }
    .card-status.downloading { color: var(--primary); }
    .card-status.done { color: var(--success); }
    .card-status.error { color: var(--destructive); }

    .q-chip {
      padding: 2px 8px;
      height: 24px;
      border: 1px solid var(--border);
      border-radius: 9999px;
      background: transparent;
      color: var(--muted-foreground);
      font-family: inherit;
      font-size: 0.72rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }
    .q-chip.active {
      border-color: transparent;
      color: var(--secondary-foreground);
      background: var(--secondary);
    }
    .q-chip:hover:not(.active) { background: var(--secondary); color: var(--foreground); }

    /* Error card */
    .card.card-error {
      border-color: color-mix(in srgb, var(--destructive) 40%, transparent);
      background: color-mix(in srgb, var(--destructive) 5%, var(--card));
    }
    .card-error-icon {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: color-mix(in srgb, var(--destructive) 10%, transparent);
      color: var(--destructive);
    }
    .card-error-icon svg {
      width: 24px;
      height: 24px;
    }
    .card-error-msg {
      font-size: 0.8rem;
      color: var(--destructive);
      margin-top: 2px;
      line-height: 1.4;
    }
    .card-error-url {
      font-size: 0.72rem;
      font-family: 'Geist Mono', ui-monospace, monospace;
      color: var(--muted-foreground);
      word-break: break-all;
      margin-top: 4px;
    }

    /* Download all bar */
    .dl-all-bar {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }
    .dl-all-btn {
      flex: 1;
      height: 38px;
      padding: 0 16px;
      font-size: 0.875rem;
      background: var(--background);
      color: var(--foreground);
      border-color: var(--border);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    }
    .dl-all-btn:hover:not(:disabled) { background: var(--secondary); }

    /* "Save to server" = primary (red) button */
    .card-dl-btn.server,
    .dl-all-btn.server {
      background: var(--primary);
      border-color: var(--primary);
      color: var(--primary-foreground);
    }
    .card-dl-btn.server:hover:not(:disabled),
    .dl-all-btn.server:hover:not(:disabled) { background: var(--primary-hover); border-color: var(--primary-hover); }

    .spin {
      display: inline-block;
      width: 10px; height: 10px;
      border: 2px solid currentColor;
      border-right-color: transparent;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .footer {
      margin-top: 48px;
      text-align: center;
      font-size: 0.8rem;
      color: var(--muted-foreground);
      line-height: 1.8;
    }

    /* Mobile */
    @media (max-width: 500px) {
      .brand h1 { font-size: 1.875rem; }
      .page { padding: 40px 16px 60px; }
      .card { flex-direction: column; gap: 10px; }
      .card-thumb {
        width: 100%;
        min-width: unset;
        height: 160px;
      }
      .card-title { white-space: normal; }
      .controls { flex-wrap: wrap; }
      .fetch-btn { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="brand">
      <h1>DownLoader</h1>
      <p>Powered by ReClip</p>
    </div>

    <textarea id="urls" placeholder="Paste one or more URLs..." rows="2"></textarea>
    <p class="hint">Multiple links? Separate with spaces, commas, or newlines.</p>

    <div class="controls">
      <div class="pill-group">
        <button class="pill active" data-format="video" onclick="setFormat(this)">MP4</button>
        <button class="pill" data-format="audio" onclick="setFormat(this)">MP3</button>
      </div>
      <button class="fetch-btn" id="goBtn" onclick="go()">Fetch</button>
    </div>

    <div id="cards" class="cards"></div>

    <div class="footer">
      YouTube &middot; TikTok &middot; Instagram &middot; Twitter/X &middot; Reddit &middot; Facebook<br>
      Vimeo &middot; Twitch &middot; Dailymotion &middot; SoundCloud &middot; Loom &middot; Streamable<br>
      Pinterest &middot; Tumblr &middot; Threads &middot; LinkedIn &middot; 1000+ more
    </div>
  </div>

  <script>
    let currentFormat = 'video';
    let cardData = [];

    function setFormat(btn) {
      document.querySelectorAll('.pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFormat = btn.dataset.format;
    }

    function parseUrls(text) {
      return [...new Set(text.split(/[\s,]+/).map(u => u.trim()).filter(u => u.startsWith('http')))];
    }

    function fmtDur(s) {
      if (!s) return '';
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return `${m}:${sec.toString().padStart(2, '0')}`;
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    function friendlyError(err) {
      if (err.includes('Unsupported URL')) return 'This URL is not supported';
      if (err.includes('Video unavailable')) return 'Video is unavailable or private';
      if (err.includes('Private video')) return 'This video is private';
      if (err.includes('HTTP Error 403')) return 'Access denied by the platform';
      if (err.includes('HTTP Error 404')) return 'Video not found';
      if (err.includes('copyright')) return 'Video blocked due to copyright';
      if (err.includes('geo')) return 'Video not available in your region';
      if (err.includes('timed out') || err.includes('Timed out')) return 'Request timed out — try again';
      if (err.includes('network') || err.includes('Network')) return 'Network error — check your connection';
      return err.length > 80 ? err.slice(0, 80) + '...' : err;
    }

    document.getElementById('urls').addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); go(); }
    });

    async function go() {
      const urls = parseUrls(document.getElementById('urls').value);
      if (!urls.length) return;

      const btn = document.getElementById('goBtn');
      const container = document.getElementById('cards');
      btn.disabled = true;
      btn.textContent = 'Loading...';
      container.innerHTML = '';
      cardData = [];

      // Check if youtube playlist URL
      for (let i = 0; i < urls.length; i++) {
        if (urls[i].includes('list=')) {
          const res = await fetch('/api/playlist', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url: urls[i] }),
          });
          const data = await res.json();
          if (data.urls) {
            // replace playlist URL with individual video URLs
            urls.splice(i, 1, ...data.urls);
          }
        }
      }

      for (let i = 0; i < urls.length; i++) {
        const url = urls[i];
        const idx = cardData.length;
        cardData.push({ url, status: 'loading' });
        renderCard(idx);

        try {
          const res = await fetch('/api/info', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url }),
          });
          const data = await res.json();
          if (data.error) {
            cardData[idx] = { ...cardData[idx], status: 'info-error', error: data.error };
          } else {
            cardData[idx] = {
              ...cardData[idx],
              status: 'ready',
              title: data.title || '',
              thumbnail: data.thumbnail || '',
              duration: data.duration,
              uploader: data.uploader || '',
              formats: data.formats || [],
              selectedFormatId: data.formats?.[0]?.id || null,
            };
          }
        } catch (err) {
          cardData[idx] = { ...cardData[idx], status: 'info-error', error: err.message };
        }
        renderCard(idx);
      }

      if (cardData.filter(c => c.status === 'ready').length > 1) {
        renderDownloadAll();
      }

      btn.disabled = false;
      btn.textContent = 'Fetch';
    }

    function renderCard(idx) {
      const c = cardData[idx];
      let el = document.getElementById(`card-${idx}`);
      if (!el) {
        el = document.createElement('div');
        el.id = `card-${idx}`;
        el.className = 'card';
        document.getElementById('cards').appendChild(el);
      }

      // Loading skeleton
      if (c.status === 'loading') {
        el.className = 'card';
        el.innerHTML = `
          <div class="card-thumb loading"></div>
          <div class="card-body">
            <div class="skeleton-line medium"></div>
            <div class="skeleton-line short"></div>
          </div>
        `;
        return;
      }

      // Error state
      if (c.status === 'info-error') {
        el.className = 'card card-error';
        el.innerHTML = `
          <div class="card-thumb">
            <div class="card-error-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
            </div>
          </div>
          <div class="card-body">
            <div class="card-title" style="color:var(--error)">Could not fetch video</div>
            <div class="card-error-msg">${esc(friendlyError(c.error || ''))}</div>
            <div class="card-error-url">${esc(c.url)}</div>
          </div>
        `;
        return;
      }

      // Ready / downloading / done / error states
      el.className = 'card';
      const isAudio = currentFormat === 'audio';

      let thumbHtml;
      if (isAudio) {
        thumbHtml = `<div class="no-thumb" style="color:var(--accent)"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="5 3 19 12 5 21 5 3"/></svg></div>`;
      } else if (c.thumbnail) {
        thumbHtml = `<img src="${c.thumbnail}" alt="">`;
      } else {
        thumbHtml = `<div class="no-thumb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="2"/><circle cx="8" cy="8" r="1.5"/><path d="m21 15-5-5L5 21"/></svg></div>`;
      }

      let qualityChips = '';
      if (!isAudio && c.formats && c.formats.length > 1) {
        qualityChips = c.formats.map(f =>
          `<button class="q-chip${f.id === c.selectedFormatId ? ' active' : ''}" onclick="pickFormat(${idx}, '${f.id}')">${f.label}</button>`
        ).join('');
      }

      let actionHtml = '';
      if (c.status === 'ready') {
        actionHtml = `<button class="card-dl-btn" onclick="dlCard(${idx}, 'browser')">Download</button>
          <button class="card-dl-btn server" onclick="dlCard(${idx}, 'server')">Save to server</button>${qualityChips}`;
      } else if (c.status === 'downloading') {
        actionHtml = `<span class="card-status downloading"><span class="spin"></span> Downloading...</span>`;
      } else if (c.status === 'done' && c.dest === 'server') {
        actionHtml = `<span class="card-status done">Saved to server: ${esc(c.filename || '')}</span>`;
      } else if (c.status === 'done') {
        actionHtml = `<button class="card-dl-btn done" onclick="saveCard(${idx})">Save</button>
          <span class="card-status done">${esc(c.filename || '')}</span>`;
      } else if (c.status === 'error') {
        actionHtml = `<button class="card-dl-btn" onclick="dlCard(${idx}, '${c.dest || 'browser'}')">Retry</button>
          <span class="card-status error">${esc(friendlyError(c.error || 'Download failed'))}</span>`;
      }

      el.innerHTML = `
        <div class="card-thumb">${thumbHtml}</div>
        <div class="card-body">
          <div class="card-title">${esc(c.title || 'Untitled')}</div>
          <div class="card-meta">${esc(c.uploader)}${c.duration ? ' · ' + fmtDur(c.duration) : ''}</div>
          <div class="card-actions">${actionHtml}</div>
        </div>
      `;
    }

    function renderDownloadAll() {
      const existing = document.getElementById('dl-all-bar');
      if (existing) existing.remove();

      const bar = document.createElement('div');
      bar.id = 'dl-all-bar';
      bar.className = 'dl-all-bar';
      bar.innerHTML = `<button class="dl-all-btn" onclick="dlAll('browser')">Download All</button>
        <button class="dl-all-btn server" onclick="dlAll('server')">Save All to Server</button>`;
      document.getElementById('cards').appendChild(bar);
    }

    function pickFormat(idx, formatId) {
      cardData[idx].selectedFormatId = formatId;
      renderCard(idx);
    }

    async function dlCard(idx, dest = 'browser') {
      const c = cardData[idx];
      c.dest = dest;
      c.status = 'downloading';
      c.error = null;
      renderCard(idx);

      try {
        const res = await fetch('/api/download', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            url: c.url,
            format: currentFormat,
            format_id: c.selectedFormatId,
            title: c.title || '',
            dest,
          }),
        });
        const data = await res.json();
        if (data.error) {
          c.status = 'error';
          c.error = data.error;
          renderCard(idx);
          return;
        }
        c.jobId = data.job_id;
        pollCard(idx);
      } catch (err) {
        c.status = 'error';
        c.error = err.message;
        renderCard(idx);
      }
    }

    function pollCard(idx) {
      const c = cardData[idx];
      const iv = setInterval(async () => {
        try {
          const res = await fetch(`/api/status/${c.jobId}`);
          const data = await res.json();
          if (data.status === 'done') {
            clearInterval(iv);
            c.status = 'done';
            c.filename = data.filename;
            renderCard(idx);
            if (c.dest !== 'server') saveCard(idx);
          } else if (data.status === 'error') {
            clearInterval(iv);
            c.status = 'error';
            c.error = data.error;
            renderCard(idx);
          }
        } catch {
          clearInterval(iv);
          c.status = 'error';
          c.error = 'Lost connection to server';
          renderCard(idx);
        }
      }, 1000);
    }

    function saveCard(idx) {
      const c = cardData[idx];
      if (!c.jobId) return;
      const a = document.createElement('a');
      a.href = `/api/file/${c.jobId}`;
      a.download = c.filename || '';
      a.click();
    }

    async function dlAll(dest = 'browser') {
      const btns = document.querySelectorAll('.dl-all-btn');
      btns.forEach(b => { b.disabled = true; });

      for (let i = 0; i < cardData.length; i++) {
        if (cardData[i].status === 'ready') {
          await dlCard(i, dest);
        }
      }

      btns.forEach(b => { b.disabled = false; });
    }
  </script>
</body>
</html>
